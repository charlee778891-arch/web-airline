
name: Web PDFs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compress-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Compress All PDFs
        run: |
          mkdir -p compressed-pdfs

          count=0

          while IFS= read -r -d '' file; do
            output="compressed-pdfs/${file#./}"
            mkdir -p "(dirname"output")"

            gs -sDEVICE=pdfwrite \
              -dCompatibilityLevel=1.4 \
              -dPDFSETTINGS=/ebook \
              -dNOPAUSE \
              -dQUIET \
              -dBATCH \
              -sOutputFile="$output" \
              "$file"

            count=$((count + 1))
          done < <(find . -type f -iname "*.pdf" \
            ! -path "./compressed-pdfs/*" -print0)

          if [ "$count" -eq 0 ]; then
            echo "No PDF files found"
            exit 1
          fi

          echo "Total PDFs: $count"

      - name: Upload Direct PDF Folder
        uses: actions/upload-artifact@v4
        with:
          name: Compressed-PDFs
          path: compressed-pdfs/
          retention-days: 7


